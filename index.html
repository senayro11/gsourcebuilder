<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise System — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applied before first paint so a saved theme preference doesn't
    // flash the wrong theme first -- default (no saved value) is dark,
    // matching how this app has always looked.
    document.documentElement.setAttribute('data-theme', localStorage.getItem('ent_theme') === 'light' ? 'light' : 'dark');
    // At the site root -- shared scripts (auth.js/ui.js/db.js) fall back
    // to '' when ROOT is undefined, but declaring it explicitly here keeps
    // the convention visible.
    const ROOT = '';
  </script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-wrap { width:100%; max-width:420px; padding:24px; }
    .login-logo { text-align:center; margin-bottom:36px; }
    .login-logo .logo-icon { font-size:52px; margin-bottom:12px; }
    .login-logo h1 { font-size:24px; font-weight:800; color:var(--white); }
    .login-logo p  { color:var(--text2); margin-top:4px; font-size:14px; }
    .login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px; }
    .login-card h2 { font-size:18px; font-weight:700; margin-bottom:24px; color:var(--white); }
    .login-footer { text-align:center; margin-top:20px; color:var(--text3); font-size:12px; }
    .input-wrap { position:relative; }
    .input-wrap input { padding-left:40px; }
    .input-wrap .input-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text3); }
    .demo-accounts { margin-top:16px; background:var(--surface2); border-radius:8px; padding:12px; }
    .demo-accounts p { font-size:11px; color:var(--text3); margin-bottom:8px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
    .demo-row { display:flex; gap:6px; flex-wrap:wrap; }
    .demo-chip { background:var(--border); color:var(--text2); font-size:11px; padding:3px 8px; border-radius:4px; cursor:pointer; font-family:var(--mono); }
    .demo-chip:hover { background:var(--accent); color:white; }
    .loading-screen { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:999; }
    .loading-screen .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<!-- Briefly shown while checking for an existing session -->
<div class="loading-screen" id="loading-screen">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:14px">Loading system...</div>
</div>

<!-- Main login (hidden until ready) -->
<div class="login-wrap" id="main-login" style="display:none">
  <div class="login-logo">
    <div class="logo-icon">🏢</div>
    <h1>Enterprise System</h1>
    <p>Integrated Business Management</p>
  </div>

  <div class="login-card">
    <h2>Login</h2>
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
      </div>
    </div>
    <button class="btn btn-primary w-full" onclick="doLogin()" id="login-btn">🚀 Login</button>
    <div id="login-error" style="display:none;margin-top:12px;padding:10px 14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#f87171;font-size:13px"></div>

    <div class="demo-accounts">
      <p>Demo accounts (password: admin123)</p>
      <div class="demo-row">
        <span class="demo-chip" onclick="fillDemo('superadmin','admin123')">superadmin</span>
        <span class="demo-chip" onclick="fillDemo('admin_pos','admin123')">admin_pos</span>
        <span class="demo-chip" onclick="fillDemo('staff01','admin123')">staff01</span>
        <span class="demo-chip" onclick="fillDemo('ojt01','admin123')">ojt01</span>
        <span class="demo-chip" onclick="fillDemo('guest01','admin123')">guest01</span>
      </div>
    </div>
  </div>
  <div class="login-footer">Enterprise System v1.0 &bull; Powered by GitHub Pages</div>
</div>

<div id="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/sync.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
// ============================================================
//  LOGIN VIA WORKER PROXY
//  The real GitHub token lives only in the login-proxy Worker's
//  secrets now — it's handed to the browser only after the
//  username/password are verified server-side. No per-device token
//  entry needed anymore; sharing the login link is enough.
// ============================================================

const LOGIN_PROXY_URL = 'https://eis-login-proxy.v-ryane59.workers.dev';

function bootstrap() {
  // Redirect if already have a valid session + saved token on this device
  const existing = Auth.getSession();
  if (existing && Auth.loadToken()) {
    window.location.href = Auth.getHomeUrl(existing);
    return;
  }
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('main-login').style.display     = '';
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');

  if (!username || !password) { showError('Fill in all fields.'); return; }

  btn.disabled    = true;
  btn.textContent = '⏳ Logging in...';
  document.getElementById('login-error').style.display = 'none';

  try {
    const res = await fetch(LOGIN_PROXY_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ username, password })
    });
    const result = await res.json().catch(() => ({}));

    if (res.status === 429) {
      showError('Too many login attempts. Please wait a few minutes and try again.');
    } else if (!res.ok) {
      showError(result.error || `Login service error (HTTP ${res.status})`);
    } else if (result.success) {
      Auth.saveToken(result.token);
      Auth.setSession({ ...result.user, login_time: new Date().toISOString() });
      UI.toast(`Welcome, ${result.user.full_name}! 👋`, 'success');
      setTimeout(() => { window.location.href = Auth.getHomeUrl(result.user); }, 700);
    } else {
      showError(result.message || 'Wrong username or password.');
    }
  } catch (e) {
    showError('Could not reach the login service. Check your internet connection.');
  }

  btn.disabled  = false;
  btn.innerHTML = '🚀 Login';
}

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function fillDemo(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Start bootstrap
bootstrap();
</script>
</body>
</html>
