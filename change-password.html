<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Enterprise System</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applied before first paint so a saved theme preference doesn't
    // flash the wrong theme first -- default (no saved value) is dark,
    // matching how this app has always looked.
    document.documentElement.setAttribute('data-theme', localStorage.getItem('ent_theme') === 'light' ? 'light' : 'dark');
  </script>
</head>
<body>
<div class="app-layout">
  <nav class="navbar">
    <div class="navbar-brand" id="navbar-brand">🏢 Enterprise System</div>
    <div class="navbar-right">
      <div class="user-chip">
        <div class="avatar" id="user-avatar">A</div>
        <div class="user-info"><span class="name" id="user-name"></span><span class="role" id="user-role"></span></div>
      </div>
      <a href="dashboard.html" class="btn btn-ghost btn-sm">🏠</a>
    </div>
  </nav>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <h1>🔑 Change Password</h1>
      <p>Update your account password</p>
    </div>
    <div class="card" style="max-width:400px">
      <div class="form-group"><label>Current Password *</label><input type="password" id="cp-current"></div>
      <div class="form-group"><label>New Password *</label><input type="password" id="cp-new"></div>
      <div class="form-group"><label>Confirm New Password *</label><input type="password" id="cp-confirm"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
        <button class="btn btn-primary" onclick="changePassword()">🔑 Update Password</button>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<div id="loading-overlay" class="loading-overlay"><div class="spinner"></div><div>Loading...</div></div>

<script src="js/config.js"></script>
<script src="js/sync.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
  Auth.loadToken();
  const user = Auth.guard(null);
  if (!user) throw new Error('Not logged in');

  UI.buildNavbar(user, null);
  UI.buildSidebar(user, null);

  async function changePassword() {
    const curr = document.getElementById('cp-current').value;
    const nw = document.getElementById('cp-new').value;
    const conf = document.getElementById('cp-confirm').value;
    if (!curr || !nw || !conf) { UI.toast('Fill in all fields', 'warning'); return; }
    if (nw !== conf) { UI.toast('New passwords do not match', 'error'); return; }
    if (nw.length < 6) { UI.toast('New password must be at least 6 characters', 'warning'); return; }
    UI.loading(true, 'Changing password...');
    try {
      const currHash = await Auth.hashPassword(curr);
      const accounts = await DB.read('accountsDB', true);
      const account = accounts.find(a => a.username === user.username && a.password_hash === currHash);
      if (!account) { UI.toast('Current password is incorrect', 'error'); UI.loading(false); return; }
      const newHash = await Auth.hashPassword(nw);
      await DB.update('accountsDB', r => r.username === user.username, { password_hash: newHash });
      UI.toast('Password changed ✅', 'success');
      ['cp-current', 'cp-new', 'cp-confirm'].forEach(id => document.getElementById(id).value = '');
    } catch (e) {
      UI.toast('Error: ' + e.message, 'error');
    }
    UI.loading(false);
  }
</script>
</body>
</html>
