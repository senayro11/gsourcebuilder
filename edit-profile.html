<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile — Enterprise System</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applied before first paint so a saved theme preference doesn't
    // flash the wrong theme first -- default (no saved value) is dark,
    // matching how this app has always looked.
    document.documentElement.setAttribute('data-theme', localStorage.getItem('ent_theme') === 'light' ? 'light' : 'dark');
    // At the site root -- shared scripts (auth.js/ui.js/db.js) fall back
    // to '' when ROOT is undefined, but declaring it explicitly here keeps
    // the convention visible.
    const ROOT = '';
  </script>
</head>
<body>
<div class="app-layout">
  <nav class="navbar">
    <div class="navbar-brand" id="navbar-brand">🏢 Enterprise System</div>
    <div class="navbar-right">
      <div class="user-chip">
        <div class="avatar" id="user-avatar">A</div>
        <div class="user-info"><span class="name" id="user-name"></span><span class="role" id="user-role"></span></div>
      </div>
      <a href="dashboard.html" class="btn btn-ghost btn-sm">🏠</a>
    </div>
  </nav>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <h1>✏️ Edit Profile</h1>
      <p>Update your account information</p>
    </div>
    <div class="card" style="max-width:480px">
      <div style="text-align:center;margin-bottom:24px">
        <div id="profile-avatar-big" style="width:80px;height:80px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:white;margin:0 auto">A</div>
      </div>
      <div class="form-group"><label>Full Name *</label><input type="text" id="pf-fullname"></div>
      <div class="form-group"><label>Email</label><input type="email" id="pf-email"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
        <button class="btn btn-primary" onclick="saveProfile()">💾 Save Changes</button>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>
<div id="loading-overlay" class="loading-overlay"><div class="spinner"></div><div>Loading...</div></div>

<script src="js/config.js"></script>
<script src="js/sync.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
  Auth.loadToken();
  const user = Auth.guard(null);
  if (!user) throw new Error('Not logged in');

  UI.buildNavbar(user, null);
  UI.buildSidebar(user, null);

  document.getElementById('pf-fullname').value = user.full_name || '';
  document.getElementById('pf-email').value = user.email || '';
  document.getElementById('profile-avatar-big').textContent = (user.full_name || '?').charAt(0).toUpperCase();

  async function saveProfile() {
    const name = document.getElementById('pf-fullname').value.trim();
    if (!name) { UI.toast('Name is required', 'warning'); return; }
    const email = document.getElementById('pf-email').value.trim();
    UI.loading(true, 'Saving...');
    try {
      await DB.update('accountsDB', r => r.username === user.username, { full_name: name, email });
      const updated = { ...user, full_name: name, email };
      Auth.setSession(updated);
      document.getElementById('user-name').textContent = name;
      UI.toast('Profile updated ✅', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    } catch (e) {
      UI.toast('Error: ' + e.message, 'error');
    }
    UI.loading(false);
  }
</script>
</body>
</html>
