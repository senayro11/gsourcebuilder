<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time In / Out — HR System</title>
  <link rel="stylesheet" href="css/hr.css?v=20260801b">
  <script>
    // Applied before first paint so a saved dark-mode preference doesn't
    // flash light first -- default (no saved value) is light mode.
    document.documentElement.setAttribute('data-theme', localStorage.getItem('hr_theme') === 'dark' ? 'dark' : 'light');
  </script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .timein-wrap { width:100%; max-width:420px; padding:20px; }
    .timein-logo { text-align:center; margin-bottom:32px; }
    .timein-logo .logo-box {
      width:64px; height:64px; border-radius:18px;
      background:linear-gradient(135deg,var(--accent),var(--purple));
      display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:800; color:white;
      margin:0 auto 12px;
    }
    .timein-logo .logo-box.has-logo { background:transparent; }
    .timein-logo h1 { font-size:22px; font-weight:800; color:var(--white); }
    .timein-logo p  { color:var(--text2); font-size:13px; margin-top:4px; }
    .timein-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-xl); padding:32px;
    }
    .clock-display {
      text-align:center; margin-bottom:24px;
      padding:16px; background:var(--surface2);
      border-radius:var(--radius-lg); border:1px solid var(--border);
    }
    .clock-time {
      font-size:40px; font-weight:800; color:var(--white);
      font-family:var(--mono); letter-spacing:2px;
    }
    .clock-date { font-size:13px; color:var(--text2); margin-top:4px; }
    .emp-result {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius-lg); padding:16px;
      margin-bottom:20px; display:none;
    }
    .emp-result.show { display:flex; align-items:center; gap:14px; }
    .emp-result .emp-av {
      width:52px; height:52px; border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--purple));
      display:flex; align-items:center; justify-content:center;
      font-size:20px; font-weight:700; color:white; flex-shrink:0;
    }
    .emp-result .emp-info h3 { font-size:15px; font-weight:700; color:var(--white); }
    .emp-result .emp-info p  { font-size:12px; color:var(--text2); }
    .status-row {
      display:flex; flex-direction:column; gap:8px; margin-top:6px;
    }
    .btn-timein  { background:var(--success); color:white; flex:1; justify-content:center; padding:14px; font-size:15px; }
    .btn-timeout { background:var(--danger);  color:white; flex:1; justify-content:center; padding:14px; font-size:15px; }
    .btn-timein:hover  { background:#16a34a; }
    .btn-timeout:hover { background:#dc2626; }
    .break-actions { display:flex; flex-direction:column; gap:6px; }
    .break-row {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:8px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    }
    .break-label { font-size:13px; color:var(--white); }
    .break-window { font-size:11px; color:var(--text3); font-family:var(--mono); }
    .success-card {
      display:none; text-align:center; padding:24px;
      background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3);
      border-radius:var(--radius-lg); margin-top:16px;
    }
    .success-card.show { display:block; }
    .success-card .big-icon { font-size:48px; margin-bottom:8px; }
    .success-card h3 { color:var(--success); font-size:18px; font-weight:700; }
    .success-card p  { color:var(--text2); font-size:13px; margin-top:4px; }
    .back-link { text-align:center; margin-top:20px; }
    .back-link a { color:var(--accent2); font-size:13px; text-decoration:none; }
    .back-link a:hover { text-decoration:underline; }
    .att-today {
      margin-top:16px; padding:12px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius); display:none;
    }
    .att-today.show { display:block; }
    .att-today-label { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
    .att-today-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid var(--border); }
    .att-today-row:last-child { border-bottom:none; }
  </style>
</head>
<body>
<div class="timein-wrap">
  <div class="timein-logo">
    <div class="logo-box" id="timein-logo-icon">HR</div>
    <h1>Time In / Out</h1>
    <p>Employee Attendance Terminal</p>
  </div>

  <div class="timein-card">
    <!-- Clock -->
    <div class="clock-display">
      <div class="clock-time" id="clock">00:00:00</div>
      <div class="clock-date" id="clock-date"></div>
    </div>

    <!-- Input -->
    <div class="form-group">
      <label>Employee ID *</label>
      <input type="text" id="emp-id-input" placeholder="e.g. KH-0001" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
    </div>
    <div class="form-group">
      <label>Password *</label>
      <input type="password" id="emp-pass-input" placeholder="Enter your password">
    </div>
    <button class="btn btn-primary w-full" style="padding:12px;font-size:14px;margin-bottom:12px" onclick="verifyEmployee()">🔍 Verify Employee</button>

    <!-- Employee info after verify -->
    <div class="emp-result" id="emp-result">
      <div class="emp-av" id="emp-av">?</div>
      <div class="emp-info">
        <h3 id="emp-rname">—</h3>
        <p id="emp-rpos">—</p>
        <div class="status-row" id="emp-status-row"></div>
      </div>
    </div>

    <!-- Today's record -->
    <div class="att-today" id="att-today">
      <div class="att-today-label">Today's Record</div>
      <div class="att-today-row"><span>Time In</span><span id="today-in" style="font-family:var(--mono)">—</span></div>
      <div class="att-today-row"><span>Time Out</span><span id="today-out" style="font-family:var(--mono)">—</span></div>
      <div class="att-today-row"><span>Hours Worked</span><span id="today-hrs">—</span></div>
      <div class="att-today-row"><span>Status</span><span id="today-status">—</span></div>
      <div class="att-today-row" id="today-breaks-row" style="display:none"><span>Breaks</span><span id="today-breaks" style="font-family:var(--mono);font-size:11px"></span></div>
    </div>

    <!-- Success message -->
    <div class="success-card" id="success-card">
      <div class="big-icon" id="success-icon">✅</div>
      <h3 id="success-title">Time In Recorded!</h3>
      <p id="success-msg">Your attendance has been recorded.</p>
    </div>
  </div>

  <div class="back-link">
    <a href="attendance.html">← Back to HR System</a>
  </div>
</div>

<div id="toast-container"></div>
<div id="global-loading" class="loading-overlay"><div class="spinner"></div><div>Loading...</div></div>

<script src="js/hr-config.js?v=20260801a"></script>
<script src="../js/sync.js?v=20260801a"></script>
<script src="js/hr-core.js?v=20260801a"></script>
<script>
// ---- Clock ----
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-PH', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  document.getElementById('clock-date').textContent = now.toLocaleDateString('en-PH', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}
tick(); setInterval(tick, 1000);

// Load token
const savedToken = localStorage.getItem('ent_gh_token');
if (savedToken) GITHUB_CONFIG.token = savedToken;

// Show the company logo (set via superadmin in the HR System sidebar)
// instead of the default "HR" badge, if one has been uploaded.
(async function loadTimeinLogo() {
  try {
    const rows = await HRDB.read('hrconfigDB');
    const row = rows.find(r => r.key === 'logo');
    if (row && row.value) {
      const el = document.getElementById('timein-logo-icon');
      if (el) { el.innerHTML = `<img src="${row.value}" style="width:100%;height:100%;object-fit:contain;border-radius:inherit">`; el.classList.add('has-logo'); }
    }
  } catch (e) { /* keep default "HR" text if the config can't be read */ }
})();

let verifiedEmp = null, todayRecord = null, activeSchedule = null;

// GITHUB_CONFIG.dbPath points at "hr/db" on this page (see hr-config.js).
// Temporarily point it at the root "db" folder to read the shared
// accountsDB, then restore it -- HRDB itself is unaware of the swap.
// (mirrors rootDB() in attendance.html's User Management section)
async function rootDB(fn) {
  const saved = GITHUB_CONFIG.dbPath;
  GITHUB_CONFIG.dbPath = 'db';
  try { return await fn(); } finally { GITHUB_CONFIG.dbPath = saved; }
}

// ---- Verify Employee ----
async function verifyEmployee() {
  const empId = document.getElementById('emp-id-input').value.trim();
  const pass  = document.getElementById('emp-pass-input').value;

  if (!empId || !pass) { Toast.show('Fill in all fields','warning'); return; }

  Loading.show('Verifying...');
  try {
    const [emps, accounts, atts, schedules, weeklySchedules] = await Promise.all([
      HRDB.read('employeesDB'),
      rootDB(() => HRDB.read('accountsDB')),
      HRDB.read('attendanceDB'),
      HRDB.read('schedulesDB'),
      HRDB.read('weeklySchedulesDB')
    ]);

    // Find employee by employee_id
    const emp = emps.find(e => e.employee_id === empId && e.status === 'active');
    if (!emp) { Toast.show('Employee ID not found','error'); Loading.hide(); return; }

    // Verify password via the employee's linked main-system account (the
    // same one used to log into the app itself, and managed in User
    // Management) -- not a separate kiosk-only credential to remember.
    const hashed = await hashPw(pass);
    const acct = accounts.find(a => a.employee_id === emp.id && a.password_hash === hashed && a.status === 'active' && (a.assigned_system === 'attendance' || a.assigned_system === 'all'));
    if (!acct) { Toast.show('Incorrect password','error'); Loading.hide(); return; }

    verifiedEmp = emp;
    activeSchedule = getEffectiveSchedule(schedules, weeklySchedules, emp.id);

    // Show employee card
    document.getElementById('emp-av').textContent    = emp.name.charAt(0);
    document.getElementById('emp-rname').textContent = emp.name;
    document.getElementById('emp-rpos').textContent  = emp.position + ' — ' + emp.department;
    document.getElementById('emp-result').classList.add('show');

    // Check today's record
    const today = localDateStr();
    todayRecord = atts.find(a => a.employee_id === emp.id && a.date === today);

    if (todayRecord) {
      document.getElementById('att-today').classList.add('show');
      document.getElementById('today-in').textContent     = todayRecord.time_in  || '—';
      document.getElementById('today-out').textContent    = todayRecord.time_out || '—';
      document.getElementById('today-hrs').textContent    = todayRecord.work_hours ? parseFloat(todayRecord.work_hours).toFixed(2) + ' hrs' : '—';
      document.getElementById('today-status').textContent = todayRecord.status || '—';
    }
    renderBreakSummary(todayRecord);
    renderActionButtons(activeSchedule, todayRecord);

  } catch(e) { Toast.show('Error: ' + e.message, 'error'); }
  Loading.hide();
}

// ---- Action buttons: an explicit Time In/Time Out dropdown (instead of
// silently auto-picking one), plus per-break Start/Return while mid-shift.
// Manual selection means doTimeIn()/doTimeOut() themselves must guard
// against the wrong choice (e.g. picking "Time In" while already timed
// in) since the UI no longer prevents it by only showing the one valid
// button.
function renderActionButtons(schedule, rec) {
  const btnRow = document.getElementById('emp-status-row');
  if (rec && rec.time_out) {
    btnRow.innerHTML = `<span class="badge badge-success" style="margin-top:4px">✅ Attendance complete for today</span>`;
    return;
  }
  let html = '';
  if (rec && rec.time_in) {
    html += '<div class="break-actions">';
    BREAK_TYPES.forEach(bt => {
      const status = breakStatus(schedule, rec, bt.key);
      if (status === 'disabled') return;
      const windowLabel = schedule ? `${schedule[bt.key + '_start'] || ''}–${schedule[bt.key + '_end'] || ''}` : '';
      const paidLabel = isBreakPaid(schedule, bt.key) ? ' · Paid' : ' · Unpaid';
      let action;
      if (status === 'pending') action = `<button class="btn btn-ghost btn-sm" onclick="doBreakOut('${bt.key}')">${bt.icon} Start</button>`;
      else if (status === 'ongoing') action = `<button class="btn btn-warning btn-sm" onclick="doBreakIn('${bt.key}')">🔙 Return</button>`;
      else action = `<span class="badge badge-success">✅ Done</span>`;
      html += `<div class="break-row"><span class="break-label">${bt.icon} ${bt.label}<br><span class="break-window">${windowLabel}${paidLabel}</span></span>${action}</div>`;
    });
    html += '</div>';
  }
  const defaultAction = (rec && rec.time_in) ? 'out' : 'in';
  html += `<div class="form-group" style="margin:10px 0 0">
    <label>Action</label>
    <select id="kiosk-action">
      <option value="in" ${defaultAction === 'in' ? 'selected' : ''}>🟢 Time In</option>
      <option value="out" ${defaultAction === 'out' ? 'selected' : ''}>🔴 Time Out</option>
    </select>
  </div>
  <button class="btn btn-primary w-full" style="padding:12px;margin-top:8px" onclick="doKioskAction()">✅ Submit</button>`;
  btnRow.innerHTML = html;
}

function doKioskAction() {
  const action = document.getElementById('kiosk-action')?.value;
  if (action === 'out') doTimeOut(); else doTimeIn();
}

function renderBreakSummary(rec) {
  const row = document.getElementById('today-breaks-row');
  const text = breakSummaryText(rec);
  if (!text) { row.style.display = 'none'; return; }
  row.style.display = '';
  document.getElementById('today-breaks').textContent = text;
}

async function doTimeIn() {
  if (!verifiedEmp) return;
  // Kick off the location request immediately, as close to the click as
  // possible, and let it run alongside the lookups below instead of
  // after them -- some mobile browsers are stricter than desktop about
  // geolocation calls made a noticeable while after the user's tap, and
  // the fresh-data re-check + shift lookup were pushing it back by a
  // couple of network round-trips.
  Loading.show('Getting location...');
  const locPromise = getDeviceLocation();

  // Re-check against freshly-fetched data right before acting -- the
  // todayRecord set at verify time can go stale by the time Submit is
  // actually pressed (e.g. the employee steps away for a bit), so don't
  // trust it alone for a check this important.
  const today = localDateStr();
  const [freshAtts, shifts] = await Promise.all([
    HRDB.read('attendanceDB', true),
    HRDB.read('shiftsDB')
  ]);
  const existing = freshAtts.find(a => a.employee_id === verifiedEmp.id && a.date === today);
  if (existing) {
    todayRecord = existing;
    renderActionButtons(activeSchedule, todayRecord);
    Toast.show(existing.time_out ? 'Kumpleto na ang attendance mo ngayong araw.' : 'Naka-time-in ka na ngayong araw — piliin ang Time Out.', 'warning');
    Loading.hide();
    return;
  }
  const now    = new Date();
  const timeIn = now.toTimeString().substring(0, 5);

  // Get shift to check if late -- if this employee has no schedule
  // assigned, still guess a shift from their check-in time (AM check-in
  // -> a day-type shift, PM/evening -> a night-type shift) instead of
  // always marking them "present" with no basis to judge late/absent.
  let shift = activeSchedule ? shifts.find(sh => sh.id === activeSchedule.shift_id) : null;
  const usedDefaultShift = !shift;
  if (!shift) shift = guessShiftForTime(shifts, timeIn);
  let status = 'present';
  if (shift && shift.start_time) {
    const [sh, sm] = shift.start_time.split(':').map(Number);
    const grace    = parseInt(shift.grace_period || 15);
    const [h, m]   = timeIn.split(':').map(Number);
    if (h * 60 + m > sh * 60 + sm + grace) status = 'late';
  }
  const defaultNote = usedDefaultShift && shift ? `No schedule assigned — auto-matched to ${shift.name}` : '';

  const loc = await locPromise;
  Loading.show('Recording Time In...');
  try {
    const atts = await HRDB.read('attendanceDB', true);
    const id   = HRDB.nextId(atts, 'id', 'ATT');
    await HRDB.insert('attendanceDB', {
      id, employee_id: verifiedEmp.id, date: today,
      time_in: timeIn, time_out: '', break_minutes: shift?.break_minutes || '60',
      work_hours: '0', overtime_hours: '0', undertime: '0',
      status, notes: status === 'late'
        ? `Late by ${lateMin(timeIn, shift?.start_time)} min` + (defaultNote ? ` (${defaultNote})` : '')
        : defaultNote,
      time_in_lat: loc?.lat || '', time_in_lng: loc?.lng || '',
      time_out_lat: '', time_out_lng: '',
      approval_status: 'pending'
    });
    if (status === 'late') {
      addNotification({ audience: 'admin', type: 'attendance', title: 'Late Arrival', message: `${verifiedEmp.name} arrived late today`, referenceId: id });
    }
    showSuccess('🟢', 'Time In Recorded!', `${verifiedEmp.name} — ${timeIn}${status === 'late' ? ' (Late)' : ''}`);
    Toast.show(`Time In: ${timeIn} ✅`, 'success');
  } catch(e) { Toast.show('Error: ' + e.message, 'error'); }
  Loading.hide();
}

// ---- Break out / Break in (AM break, lunch, PM break) ----
async function doBreakOut(key) {
  if (!verifiedEmp || !todayRecord) return;
  const now = new Date().toTimeString().substring(0, 5);
  const label = (BREAK_TYPES.find(b => b.key === key) || {}).label || key;
  Loading.show(`Starting ${label}...`);
  try {
    await HRDB.update('attendanceDB', r => r.id === todayRecord.id, { [`${key}_out`]: now });
    todayRecord = { ...todayRecord, [`${key}_out`]: now };
    showSuccess('☕', `${label} Started!`, `${verifiedEmp.name} — ${now}`);
    Toast.show(`${label} started: ${now} ☕`, 'success');
  } catch(e) { Toast.show('Error: ' + e.message, 'error'); }
  Loading.hide();
}
async function doBreakIn(key) {
  if (!verifiedEmp || !todayRecord) return;
  const now = new Date().toTimeString().substring(0, 5);
  const label = (BREAK_TYPES.find(b => b.key === key) || {}).label || key;
  Loading.show(`Recording return...`);
  try {
    await HRDB.update('attendanceDB', r => r.id === todayRecord.id, { [`${key}_in`]: now });
    todayRecord = { ...todayRecord, [`${key}_in`]: now };
    showSuccess('🔙', `Returned from ${label}!`, `${verifiedEmp.name} — ${now}`);
    Toast.show(`Returned from ${label}: ${now} 🔙`, 'success');
  } catch(e) { Toast.show('Error: ' + e.message, 'error'); }
  Loading.hide();
}

async function doTimeOut() {
  if (!verifiedEmp) return;
  // Kick off the location request immediately, as close to the click as
  // possible -- see the note in doTimeIn() about mobile browsers being
  // stricter about geolocation calls made a while after the user's tap.
  Loading.show('Getting location...');
  const locPromise = getDeviceLocation();

  // Re-check against freshly-fetched data right before acting -- see
  // the same note in doTimeIn().
  const today = localDateStr();
  const [freshAtts, shifts] = await Promise.all([
    HRDB.read('attendanceDB', true),
    HRDB.read('shiftsDB')
  ]);
  const rec = freshAtts.find(a => a.employee_id === verifiedEmp.id && a.date === today);
  if (!rec) {
    todayRecord = null;
    renderActionButtons(activeSchedule, null);
    Toast.show('Kailangan mo munang mag-Time In.', 'warning');
    Loading.hide();
    return;
  }
  if (rec.time_out) {
    todayRecord = rec;
    renderActionButtons(activeSchedule, todayRecord);
    Toast.show('Mayroon ka nang Time Out ngayong araw.', 'warning');
    Loading.hide();
    return;
  }
  todayRecord = rec;
  const now     = new Date();
  const timeOut = now.toTimeString().substring(0, 5);
  const timeIn  = todayRecord.time_in;
  const date    = todayRecord.date;

  // Compute work hours
  const inDate  = new Date(`${date}T${timeIn}:00`);
  const outDate = new Date(`${date}T${timeOut}:00`);
  let workHrs   = (outDate - inDate) / 3600000;

  // Get shift + compute actual break deduction (from punches if present,
  // else configured window, else legacy flat minutes if no
  // schedule/break config exists at all)
  let shift = activeSchedule ? shifts.find(sh => sh.id === activeSchedule.shift_id) : null;
  if (!shift) shift = guessShiftForTime(shifts, timeIn);
  const brk = computeBreakMinutes(activeSchedule, todayRecord, shift?.break_minutes || 60) / 60;

  workHrs = Math.max(0, workHrs - brk);
  const otHrs  = Math.max(0, workHrs - (shift ? parseInt(shift.ot_after||480)/60 : 8));
  const utHrs  = Math.max(0, (shift ? parseInt(shift.ot_after||480)/60 : 8) - workHrs);

  const loc = await locPromise;
  Loading.show('Recording Time Out...');
  try {
    await HRDB.update('attendanceDB', r => r.id === todayRecord.id, {
      time_out:       timeOut,
      work_hours:     workHrs.toFixed(2),
      overtime_hours: otHrs.toFixed(2),
      undertime:      utHrs.toFixed(2),
      status:         todayRecord.status,
      time_out_lat:   loc?.lat || '', time_out_lng: loc?.lng || ''
    });
    showSuccess('🔴', 'Time Out Recorded!', `${verifiedEmp.name} — ${timeOut} | ${workHrs.toFixed(2)} hrs worked${otHrs > 0 ? ` | OT: ${otHrs.toFixed(2)} hrs` : ''}${utHrs > 0 ? ` | UT: ${utHrs.toFixed(2)} hrs` : ''}`);
    Toast.show(`Time Out: ${timeOut} ✅`, 'success');
  } catch(e) { Toast.show('Error: ' + e.message, 'error'); }
  Loading.hide();
}

function showSuccess(icon, title, msg) {
  document.getElementById('success-icon').textContent  = icon;
  document.getElementById('success-title').textContent = title;
  document.getElementById('success-msg').textContent   = msg;
  document.getElementById('success-card').classList.add('show');
  // Reset after 8 seconds
  setTimeout(resetForm, 8000);
}

function resetForm() {
  document.getElementById('emp-id-input').value = '';
  document.getElementById('emp-pass-input').value = '';
  document.getElementById('emp-result').classList.remove('show');
  document.getElementById('att-today').classList.remove('show');
  document.getElementById('success-card').classList.remove('show');
  document.getElementById('emp-status-row').innerHTML = '';
  verifiedEmp = null; todayRecord = null; activeSchedule = null;
  HRDB.clearCache('attendanceDB');
}

function lateMin(actual, expected) {
  if (!expected) return 0;
  const [ah,am] = actual.split(':').map(Number);
  const [eh,em] = expected.split(':').map(Number);
  return Math.max(0, (ah*60+am) - (eh*60+em));
}

async function hashPw(password) {
  const data = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Enter key
document.addEventListener('keydown', e => { if (e.key === 'Enter') verifyEmployee(); });
</script>
</body>
</html>
